candidate_pool:

  # 08 단계에서는 너무 일찍 후보를 자르지 않고
  # BGE-M3에 넘길 넓은 후보군을 유지
  max_candidates: 50

  # =====================================================
  # 산업 관련 개념 그룹
  # 같은 의미의 표현은 하나의 그룹으로 계산
  # =====================================================

  industry_groups:

    cosmetics:
      - "화장품"
      - "코스메틱"
      - "스킨케어"

    beauty_device:
      - "미용기기"
      - "미용 기기"
      - "뷰티 디바이스"
      - "홈 뷰티"
      - "피부미용"
      - "피부 미용"

    beauty_general:
      - "뷰티"

  # =====================================================
  # 사업구조 관련 개념 그룹
  # =====================================================

  business_groups:

    brand:
      - "브랜드"

    d2c:
      - "D2C"
      - "d2c"
      - "자사몰"
      - "온라인몰"
      - "온라인 판매"

    global:
      - "글로벌"
      - "수출"
      - "해외 판매"
      - "해외판매"
      - "해외법인"
      - "해외 법인"

    production:
      - "자체 생산"
      - "자체생산"

    rnd:
      - "연구개발"
      - "연구 개발"

  # =====================================================
  # 최소 통과 조건
  # =====================================================

  # 산업 관련 그룹이 최소 1개 이상
  min_industry_groups: 1

  # 사업구조 관련 그룹이 최소 2개 이상
  min_business_groups: 2

  # =====================================================
  # DART 공시 탐색 설정
  # =====================================================

  dart_scan:

    # analysis_as_of 기준 과거 정기공시 탐색 범위
    lookback_days: 800

    # DART 연속 요청 간격
    request_delay_sec: 0.15

  # =====================================================
  # 규모 필터
  # 현재는 아직 적용하지 않고 다음 단계에서 사용
  # =====================================================

  size_filter:

    enabled: true

    metric: "revenue"

    min_ratio: 0.3

    max_ratio: 3.0